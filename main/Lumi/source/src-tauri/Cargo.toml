[package]
name = "lumi"
version = "0.2.0"
description = "Lumi — votre second cerveau"
authors = ["Lumi"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "lumi_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lumi-core = { path = "core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
